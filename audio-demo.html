<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Audio demo</title>
    <style>
      :root { --bg: #f3ede1; --card: #fffaf0; --ink: #3a2f25; --muted: #7a6a58; --accent: #a0522d; --good: #4f7a4a; --bad: #a33a2a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1f1a15; --card: #2a241d; --ink: #efe4d2; --muted: #b3a38e; --accent: #e09a6a; --good: #8fc287; --bad: #e57b68; } }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 12px 16px 40px; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, 'Iowan Old Style', serif; }
      h1 { font-size: 20px; margin: 4px 0 2px; } h2 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
      p.note { color: var(--muted); margin: 0 0 8px; font-size: 13px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button { min-height: 40px; min-width: 44px; padding: 0 10px; border: 1px solid color-mix(in srgb, var(--ink) 20%, transparent); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
      button:active { transform: translateY(1px); }
      button.tier-big, button.tier-fanfare { border-color: var(--accent); }
      button.mini { min-height: 24px; min-width: 28px; padding: 0 6px; margin-left: 6px; }
      label { display: inline-flex; align-items: center; gap: 6px; margin: 2px 12px 2px 0; }
      input[type=range] { width: 110px; }
      #plan, #stats, #summary { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
      table { border-collapse: collapse; width: 100%; margin-top: 8px; }
      td { padding: 4px 6px; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); vertical-align: middle; }
      tr.pass td:nth-child(2) { color: var(--good); font-weight: bold; } tr.fail td:nth-child(2) { color: var(--bad); font-weight: bold; }
      td.metrics { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); }
      canvas { display: block; background: var(--card); border-radius: 4px; }
      .scroll { overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>Audio demo</h1>
    <p class="note">Everything is synthesised (Web Audio, D dorian). Tap anything once to unlock sound.</p>
    <div id="stats"></div>
    <h2>Settings</h2>
    <div id="settings" class="row"></div>
    <h2>Sound effects</h2>
    <div id="sfx" class="row"></div>
    <h2>Event batches (planner)</h2>
    <div id="events" class="row"></div>
    <div id="plan"></div>
    <h2>Ambience</h2>
    <div id="ambience" class="row"></div>
    <h2>Self-check (OfflineAudioContext)</h2>
    <div class="row"><button id="run">Run self-check</button></div>
    <div id="summary"></div>
    <div class="scroll"><table><tbody id="results"></tbody></table></div>
    <script type="module" src="/src/audio/demo.ts"></script>
  </body>
</html>
